<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOC Brief</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#queue">Skip to queue</a>
  <header class="top">
    <div class="brand">
      <h1>SOC Brief</h1>
      <p class="tagline"><span class="t t-guard">#rules-first</span> <span class="t t-guard">#ai-can-only-escalate</span> <span class="t t-source" id="mode">#offline</span></p>
    </div>
    <div class="score" id="score" aria-live="polite"></div>
  </header>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Alert family">
      <button type="button" class="chip on" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="ait" aria-pressed="false">#ids</button>
      <button type="button" class="chip" data-filter="sentinel" aria-pressed="false">#ai-agent</button>
      <button type="button" class="chip" data-filter="email" aria-pressed="false">#mailbox</button>
    </div>
    <div class="active" id="active-tag" aria-live="polite"></div>
    <details class="legend" id="legend">
      <summary>Legend</summary>
      <div id="legend-body"></div>
    </details>
  </div>

  <main>
    <section class="queue" id="queue" aria-label="Alert queue. Up and down arrows move, Escape clears the tag filter."></section>
    <article class="brief" id="brief" aria-live="polite" tabindex="-1"></article>
  </main>

  <details class="paste">
    <summary>Triage a pasted email</summary>
    <textarea id="email-text" rows="7" spellcheck="false" aria-label="Email text">From: IT Support &lt;helpdesk@russellmitchell-support.com&gt;
Subject: Action required: mailbox will be deleted in 2 hours
Attachment:

Your mailbox is over quota. Confirm your password at http://russellmitchell-support.com/webmail within 2 hours.</textarea>
    <button type="button" id="email-go">Brief it</button>
    <div id="email-out"></div>
  </details>

  <footer>
    <p>#AIT-ADS sample (CC-BY-4.0) · #SentinelProxy sample shape · nothing stored</p>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
